    <rect x="324" y="176" width="38" height="160" rx="12"/>
    <!-- disques extérieurs -->
    <rect x="118" y="206" width="24" height="100" rx="10"/>
    <rect x="370" y="206" width="24" height="100" rx="10"/>
  </g>
</svg>
