<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="haltere" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6ff4d"/>
      <stop offset="1" stop-color="#b4e61e"/>
    </linearGradient>
  </defs>
  <!-- Fond uni : un dégradé crée des points parasites une fois l'icône réduite -->
  <rect width="512" height="512" fill="#121417"/>
  <g fill="url(#haltere)" transform="rotate(-45 256 256)">
    <!-- barre -->
    <rect x="124" y="232" width="264" height="48" rx="14"/>
    <!-- disques intérieurs -->
    <rect x="146" y="140" width="66" height="232" rx="24"/>
    <rect x="300" y="140" width="66" height="232" rx="24"/>
    <!-- disques extérieurs -->
    <rect x="94" y="184" width="44" height="144" rx="18"/>
    <rect x="374" y="184" width="44" height="144" rx="18"/>
  </g>
</svg>
